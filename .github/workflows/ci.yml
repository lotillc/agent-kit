name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      - run: pnpm test

      # Build + test the examples/ workspace members against the just-built
      # agent-kit dist. Root compile above must run first (examples resolve
      # @lotiai/agent-kit via its exports map -> dist).
      - run: pnpm --filter coverage-agent run compile

      - run: pnpm --filter coverage-agent run test
